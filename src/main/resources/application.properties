OTEL_TRACES_EXPORTER: zipkin
OTEL_EXPORTER_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
OTEL_METRICS_EXPORTER: none
OTEL_LOGS_EXPORTER: none
OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
JAVA_TOOL_OPTIONS: >-
-javaagent:/otel/opentelemetry-javaagent.jar
-Deureka.client.enabled=true
-Deureka.client.register-with-eureka=true
-Deureka.client.fetch-registry=true
-Deureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/
-Deureka.instance.hostname=material-service
-Deureka.instance.nonSecurePort=8082
-Deureka.instance.preferIpAddress=false
SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
volumes:
- otel-java-agent:/otel:ro
depends_on:
eureka:
condition: service_healthy
material-db:
condition: service_healthy
zipkin:
condition: service_healthy
otel-java-agent-init:
condition: service_completed_successfully
restart: unless-stopped
networks:
- tfg-net
gateway:
image: ghcr.io/tfg-timothy-crittenden/gateway:latest
container_name: gateway
ports:
- "8080:8080"
environment:
EUREKA_HOST: eureka
EUREKA_PORT: "8761"
SERVICE_IP: gateway
SERVER_PORT: "8080"
OTEL_SERVICE_NAME: gateway
OTEL_TRACES_EXPORTER: zipkin
OTEL_EXPORTER_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
OTEL_METRICS_EXPORTER: none
OTEL_LOGS_EXPORTER: none
OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"
JAVA_TOOL_OPTIONS: >-
-javaagent:/otel/opentelemetry-javaagent.jar
volumes:
- otel-java-agent:/otel:ro
depends_on:
eureka:
condition: service_healthy
zipkin:
condition: service_healthy
otel-java-agent-init:
condition: service_completed_successfully
restart: unless-stopped
networks:
- tfg-net

classroom-service:
image: ghcr.io/tfg-timothy-crittenden/classroom-service:latest
container_name: classroom-service
