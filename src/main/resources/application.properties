spring.application.name=material-service
spring.cloud.config.enabled=false
server.port=8082

server.forward-headers-strategy=framework



# Disable Docker Compose auto-startup; use existing database on localhost:5434
spring.docker.compose.enabled=false

#eureka.instance.hostname=host.docker.internal
#eureka.instance.nonSecurePort=8081
#eureka.instance.preferIpAddress=false
#eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

# Eureka: always register the actual server.port (avoid registering :0)
eureka.instance.hostname=host.docker.internal
eureka.services:
mailpit:
image: axllent/mailpit
container_name: mailpit
restart: unless-stopped
ports:
- "8025:8025"
- "1025:1025"
environment:
MP_MAX_MESSAGES: 5000
MP_SMTP_AUTH_ACCEPT_ANY: 1
MP_SMTP_AUTH_ALLOW_INSECURE: 1
healthcheck:
test: [ "CMD-SHELL", "wget -qO- http://localhost:8025/ || exit 1" ]
interval: 5s
timeout: 2s
retries: 12
networks:
- tfg-net
eureka:
image: ghcr.io/tfg-timothy-crittenden/eureka:latest
container_name: eureka
ports:
- "8761:8761"
healthcheck:
test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || wget -qO- http://localhost:8761/ || exit 1"]
interval: 15s
timeout: 5s
retries: 12
start_period: 30s
restart: unless-stopped
networks:
- tfg-net

user-db:
image: postgres:16-alpine
container_name: user-db
environment:
POSTGRES_DB: user_db
POSTGRES_USER: myuser
POSTGRES_PASSWORD: secret
ports:
- "5433:5432"
volumes:
- user-db-data:/var/lib/postgresql/data
healthcheck:
test: ["CMD-SHELL", "pg_isready -U myuser -d user_db"]
interval: 10s
timeout: 5s
retries: 10
restart: unless-stopped
networks:
- tfg-net

material-db:
image: postgres:16-alpine
container_name: material-db
environment:
POSTGRES_DB: material_db
POSTGRES_USER: myuser
POSTGRES_PASSWORD: secret
ports:
- "5434:5432"
volumes:
- material-db-data:/var/lib/postgresql/data
healthcheck:
test: ["CMD-SHELL", "pg_isready -U myuser -d material_db"]
interval: 10s
timeout: 5s
retries: 10
restart: unless-stopped
networks:
- tfg-net

classroom-db:
image: postgres:16-alpine
container_name: classroom-db
environment:
POSTGRES_DB: classroom_db
POSTGRES_USER: myuser
POSTGRES_PASSWORD: secret
ports:
- "5435:5432"
volumes:
- classroom-db-data:/var/lib/postgresql/data
healthcheck:
test: ["CMD-SHELL", "pg_isready -U myuser -d classroom_db"]
interval: 10s
timeout: 5s
retries: 10
restart: unless-stopped
networks:
- tfg-net

zipkin:
image: openzipkin/zipkin:latest
container_name: zipkin
ports:
- "9411:9411"
healthcheck:
test: ["CMD-SHELL", "wget -qO- http://localhost:9411/health || exit 1"]
interval: 10s
timeout: 5s
retries: 12
start_period: 20s
restart: unless-stopped
networks:
- tfg-net
user-service:
image: ghcr.io/tfg-timothy-crittenden/user-service:latest
container_name: user-service
ports:
- "18081:8082"
environment:
SPRING_APPLICATION_NAME: user-service
SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_db
SPRING_DATASOURCE_USERNAME: myuser
SPRING_DATASOURCE_PASSWORD: secret
SPRING_SQL_INIT_MODE: always
SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
SPRING_JPA_HIBERNATE_DDL_AUTO: update
MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info

OTEL_SERVICE_NAME: user-service
OTEL_TRACES_EXPORTER: zipkin
OTEL_EXPORTER_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
OTEL_METRICS_EXPORTER: none
OTEL_LOGS_EXPORTER: none
OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED: "true"

JAVA_TOOL_OPTIONS: >-
-javaagent:/otel/opentelemetry-javaagent.jar
-Deureka.client.enabled=true
-Deureka.client.register-with-eureka=true
-Deureka.client.fetch-registry=true
-Deureka.client.serviceUrl.defaultZone=http://eureka:8761/eureka/
-Deureka.instance.hostname=user-service
-Deureka.instance.nonSecurePort=8082
-Deureka.instance.preferIpAddress=false

SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"

# Mailpit inside the docker network (service name = mailpit)
SPRING_MAIL_HOST: mailpit
SPRING_MAIL_PORT: 1025
SPRING_MAIL_USERNAME:
SPRING_MAIL_PASSWORD:
APP_MAIL_FROM: no-reply@tfg.local

volumes:
- otel-java-agent:/otel:ro

depends_on:
eureka:
condition: service_healthy
user-db:
condition: service_healthy
zipkin:
condition: service_healthy
otel-java-agent-init:
condition: service_completed_successfully
mailpit:
condition: service_healthy

restart: unless-stopped
networks:
- tfg-net

material-service:
image: ghcr.io/tfg-timothy-crittenden/material-service:latest
container_name: material-service
ports:
- "18082:8082"
environment:
SPRING_APPLICATION_NAME: material-service
SPRING_DATASOURCE_URL: jdbc:postgresql://material-db:5432/material_db
SPRING_DATASOURCE_USERNAME: myuser
SPRING_DATASOURCE_PASSWORD: secret
SPRING_SQL_INIT_MODE: always
SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
SPRING_JPA_HIBERNATE_DDL_AUTO: update
MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
