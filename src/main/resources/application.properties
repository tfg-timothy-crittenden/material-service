spring.application.name=material-service
spring.cloud.config.enabled=false
server.port=8082
server.forward-headers-strategy=framework

# Eureka configuration
eureka.instance.hostname=host.docker.internal
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.hostname}:${server.port}
eureka.instance.preferIpAddress=false
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

logging.level.org.springframework.security=INFO
logging.level.com.netflix.discovery=INFO
logging.level.org.springframework.cloud.netflix.eureka=INFO
logging.level.io.grpc=WARN
logging.level.io.grpc.netty.shaded.io.grpc.netty=WARN
logging.level.io.grpc.netty.shaded.io.netty=WARN
logging.level.org.springframework.kafka=INFO
logging.level.org.apache.kafka=INFO
logging.level.com.timcritt.tfg.infrastructure.messaging=INFO
logging.level.org.springframework.core.env=DEBUG

# Eureka client (common)
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Local auth-service database (isolated from the original project)
# A quick fix has beeen added here to prevent errors with JSON being interpreted as var char. (?stringtype=unspecified added to the end)
spring.datasource.url=jdbc:postgresql://localhost:5434/material_db?stringtype=unspecified
spring.datasource.username=myuser
spring.datasource.password=secret

# Flyway configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0.0
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true
spring.flyway.validateMigrationNaming=true

# Use existing DB only; do not run Spring SQL init scripts like data.sql
spring.sql.init.mode=never

# MinIO configuration for local development
minio.url=http://localhost:9000
minio.public-url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin123

# Disable Spring Boot Docker Compose integration
spring.docker.compose.enabled=false

# Multipart upload limits (allow part image + multiple audio files)

server.tomcat.max-part-count=50
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=200MB

# Kafka (used to publish material lifecycle events)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.listener.auto-startup=true
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
material.kafka.material-details-requested-topic=material.details.requested.v1
material.kafka.material-details-requested-group-id=material-service-material-details-requested
material.kafka.material-details-upserted-topic=material.details.upserted.v1
messaging.topics.material-deleted=material.deleted.v1

# Classroom-service authorization integration
authorization.classroom.enabled=true
authorization.classroom.fail-open=false

# Classroom-service gRPC authorization integration via Eureka
classroom.authorization.service-name=classroom-service
classroom.authorization.internal-api-key=${CLASSROOM_INTERNAL_API_KEY:test123}
classroom.authorization.deadline-millis=1500

#logging - make logs trace aware when captured with loki and viewed with grafana
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} trace_id=%X{trace_id} span_id=%X{span_id} - %msg%n

# JWT resource server config (must match user-service app.jwt.secret)
security.jwt.hs256.secret=${APP_JWT_SECRET:change-me-change-me-change-me-change-me}
# Supported values: raw | base64 | hex
security.jwt.hs256.secret-format=raw
# Supported values: HS256 | HS384 | HS512
security.jwt.hs256.algorithm=HS256

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Observability
management.metrics.distribution.percentiles-histogram.http.server.requests=true
