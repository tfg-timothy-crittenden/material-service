spring.application.name=material-service
spring.cloud.config.enabled=false
server.port=8081

# Disable Docker Compose auto-startup; use existing database on localhost:5434
spring.docker.compose.enabled=false

eureka.instance.hostname=host.docker.internal
eureka.instance.nonSecurePort=8081
eureka.instance.preferIpAddress=false
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

logging.level.com.netflix.discovery=DEBUG
logging.level.org.springframework.cloud.netflix.eureka=DEBUG
logging.level.org.springframework.core.env=DEBUG

# Local auth-service database (isolated from the original project)
spring.datasource.url=jdbc:postgresql://localhost:5434/material_db
spring.datasource.username=myuser
spring.datasource.password=secret


# Keep Flyway pointed to the same database explicitly
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# Use existing DB only; do not run Spring SQL init scripts like data.sql
spring.sql.init.mode=never

# Keep Hibernate from creating/updating schema automatically
#spring.jpa.hibernate.ddl-auto=validate


