otel-java-agent-init:
image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:latest
container_name: otel-java-agent-init
command:
- sh
- -ec
- >-
set -eux;
AGENT=/otel/opentelemetry-javaagent.jar;
SRC=/javaagent.jar;
mkdir -p /otel;
if [ -f "$$AGENT" ]; then
echo "OpenTelemetry Java agent already present";
ls -lah "$$AGENT";
exit 0;
fi;
cp "$$SRC" "$$AGENT";
chmod 444 "$$AGENT" || true;
echo "Installed:";
ls -lah /otel;
volumes:
- otel-java-agent:/otel
restart: "no"

minio:
image: minio/minio:RELEASE.2025-02-28T09-55-16Z
container_name: minio
command: server /data --console-address ":9001"
environment:
MINIO_ROOT_USER: minioadmin
MINIO_ROOT_PASSWORD: minioadmin123
ports:
- "9000:9000"
- "9001:9001"
volumes:
- minio-data:/data
healthcheck:
test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
interval: 10s
timeout: 5s
retries: 12
start_period: 20s
restart: unless-stopped
networks:
- tfg-net

networks:
tfg-net:
driver: bridge

volumes:
user-db-data:
material-db-data:
classroom-db-data:
otel-java-agent:
minio-data:
instance.nonSecurePort=${server.port}
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.hostname}:${server.port}
eureka.instance.preferIpAddress=false
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

logging.level.org.springframework.security=DEBUG

# Eureka client (common)
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


logging.level.com.netflix.discovery=DEBUG
logging.level.org.springframework.cloud.netflix.eureka=DEBUG
logging.level.org.springframework.core.env=DEBUG

# Local auth-service database (isolated from the original project)
spring.datasource.url=jdbc:postgresql://localhost:5434/material_db
spring.datasource.username=myuser
spring.datasource.password=secret


# Keep Flyway pointed to the same database explicitly
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.enabled=true

# Use existing DB only; do not run Spring SQL init scripts like data.sql
spring.sql.init.mode=never

# Keep Hibernate from creating/updating schema automatically
#spring.jpa.hibernate.ddl-auto=validate


