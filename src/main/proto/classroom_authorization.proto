syntax = "proto3";

package classroom.authorization.v1;

option java_multiple_files = true;
option java_package = "com.timcritt.tfg.infrastructure.security.authorization.grpc";
option java_outer_classname = "ClassroomAuthorizationProto";

service ClassroomAuthorizationService {
  rpc CheckMaterialAccess (AuthorizationCheckRequest) returns (AuthorizationCheckResponse);
}

message AuthorizationCheckRequest {
  string user_id = 1;
  int64 material_id = 2;
  string action = 3;
}

message AuthorizationCheckResponse {
  bool allowed = 1;
  string reason = 2;
  string effective_role = 3;
}

